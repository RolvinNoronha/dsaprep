spring.application.name=dsaprep

# postgres
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# jwt
spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=${JWT_EXPIRATION}

# client url
client.url.one=${CLIENT_URL_1}

# judge0
# Replace with your Judge0 CE instance URL (e.g., http://localhost:2358 for self-hosted)
judge0.api.url=${JUDGE0_API_URL:http://localhost:2358}

# flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations